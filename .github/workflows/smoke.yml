name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke test
        run: pnpm smoke
