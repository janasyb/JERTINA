global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "jertina-api"
    static_configs:
      - targets: ["api:4000"]

  - job_name: "jertina-ai"
    static_configs:
      - targets: ["ai:4100"]

  - job_name: "jertina-web"
    static_configs:
      - targets: ["web:3000"]

  - job_name: "jertina-admin"
    static_configs:
      - targets: ["admin:3000"]
